name: movies_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  dio: ^5.9.0
  flutter_bloc: ^9.1.1

  # === merged from main ===
  provider: ^6.1.2
  http: ^1.3.0
  webview_flutter: ^4.2.0

  # === merged from dev ===
  google_fonts: ^6.3.2
  equatable: ^2.0.7
  flutter_native_splash: ^2.4.7
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.4.0
  flutter_lints: ^5.0.0

flutter_gen:
  output: lib/gen/
  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/profile/
    - assets/common/
    - assets/common/avaters/
    - assets/main_layer/
    - assets/movie_details/
    - assets/onboarding-auth/forget_password/
    - assets/onboarding-auth/icons/
    - assets/onboarding-auth/onboarding_wallpapers/
    - assets/onboarding-auth/splash_screen/
